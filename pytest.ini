[pytest]
# A couple of tests fit a model or run a script end to end and cost seconds
# each. They validate the estimator rather than guard a regression, so the
# default run leaves them out. `pytest -m slow` runs those alone, `pytest -m ""`
# runs everything.
addopts = -m "not slow"
markers =
    slow: seconds-long model fits and subprocess runs, excluded by default
